<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="msapplication-navbutton-color" content="#000000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* Самый агрессивный сброс фона */
        html, body { 
            background-color: #000000 !important; 
            color: #ffffff; 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            min-height: 100vh;
            font-family: -apple-system, system-ui, sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .main {
            position: relative;
            z-index: 10;
            padding: calc(60px + env(safe-area-inset-top)) 20px 100px 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* ПОДЛОЖКА (Упрощенная для стабильности) */
        .bg-lines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(-45deg, #CCFF00 0, #CCFF00 1px, transparent 1px, transparent 60px);
            opacity: 0.03;
            z-index: 1;
            pointer-events: none;
        }

        header { margin-bottom: 40px; border-bottom: 2px solid #CCFF00; display: inline-block; padding-bottom: 10px; }
        h1 { font-size: 32px; font-weight: 900; margin: 0; letter-spacing: -1px; }
        h1 span { color: #CCFF00; }

        /* ШАХМАТНЫЕ КАРТОЧКИ */
        .card {
            background: #0d0d0d;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #1a1a1a;
        }
        .card.left { border-left: 5px solid #CCFF00; }
        .card.right { border-right: 5px solid #CCFF00; }

        h2 { font-size: 11px; letter-spacing: 3px; color: #CCFF00; opacity: 0.5; margin: 0 0 10px 0; }
        p { font-size: 16px; line-height: 1.5; margin: 0; opacity: 0.9; }

        .btn {
            display: block;
            width: 100%;
            background: #CCFF00;
            color: #000;
            text-align: center;
            padding: 20px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 16px;
            text-decoration: none;
            margin-top: 30px;
            border: none;
            box-shadow: 0 0 30px rgba(204, 255, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="bg-lines"></div>
    
    <div class="main">
        <header>
            <h1><span>SYNC</span>GO</h1>
        </header>

        <section class="card left">
            <h2>КТО МЫ?</h2>
            <p><b>SyncGo Agency</b> — архитекторы цифрового превосходства. Мы синхронизируем ваш продукт с нейронными путями клиента.</p>
        </section>

        <section class="card right">
            <h2>ЧТО МЫ ДЕЛАЕМ?</h2>
            <p>Проектируем <b>Mini Apps</b> уровня Digital Luxury и внедряем системы автоматического дожима 24/7.</p>
        </section>

        <button class="btn" onclick="send()">ПОЛУЧИТЬ АУДИТ</button>
    </div>

    <script>
        try {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');
            
            function send() {
                tg.HapticFeedback.notificationOccurred('success');
                tg.showConfirm("ЗАПУСТИТЬ ПРОТОКОЛ?");
            }
        } catch (e) {
            console.error("Critical JS Error");
        }
    </script>
</body>
</html>
